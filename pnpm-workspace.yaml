packages:
  - '.'

# https://pnpm.io/supply-chain-security
# Same as passing --frozen-lockfile on every pnpm install (CI uses this via plugin-ci-workflows too).
frozenLockfile: true
# Disable lifecycle scripts like husky git hooks such as postinstall.
ignoreScripts: true
# Five days in minutes (5 × 24 × 60).
minimumReleaseAge: 7200
# Temporary: fast-uri@4.1.2 is ~2h under the age gate; remove after it matures.
minimumReleaseAgeExclude:
  - fast-uri@4.1.2
  # Renovate security update: react-router-dom@7.0.0
  - react-router-dom@7.0.0
# Fail install if a package's trust evidence is weaker than an earlier release (e.g. lost trusted publisher).
trustPolicy: no-downgrade
# Transitive deps must come from the registry/workspace; block git/tarball URLs except on direct deps.
blockExoticSubdeps: true
# Requires every dependency with a lifecycle script to be listed in allowBuilds
strictDepBuilds: true

allowBuilds:
  unrs-resolver: true

overrides:
  '@types/node': 24.10.1
  chokidar: ^5.0.0
  react-redux: ^9.3.0
  semver: ^7.7.4
  ua-parser-js: 2.0.10
  lodash: ^4.18.0
  react-router: ^6.30.2
  serialize-javascript: ^7.0.5
  immutable: ^5.1.8
  dompurify: ^3.4.13
  yaml: ^2.8.3
  minimatch@^3: ~3.1.4
  minimatch@^9: ~10.2.0
  minimatch@^10: ^10.2.3
  uuid: ^14.0.0
  js-cookie: ^3.0.7
  ws: 8.21.0
  js-yaml: 4.3.1
  '@opentelemetry/core': 2.8.0
  qs: ^6.15.2
  brace-expansion@^1: 1.1.18
  brace-expansion@^5: '>=5.0.9'
  fast-uri: '>=4.1.2'
  postcss: ^8.5.23
  nanoid@^3: '>=3.3.17 <4'
