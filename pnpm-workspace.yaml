packages:
  - '.'

# https://pnpm.io/supply-chain-security
# Same as passing --frozen-lockfile on every pnpm install (CI uses this via plugin-ci-workflows too).
frozenLockfile: true
# Disable lifecycle scripts like husky git hooks such as postinstall.
ignoreScripts: true
# Three days in minutes (3 × 24 × 60).
minimumReleaseAge: 4320
# Fail install if a package's trust evidence is weaker than an earlier release (e.g. lost trusted publisher).
trustPolicy: no-downgrade
# Transitive deps must come from the registry/workspace; block git/tarball URLs except on direct deps.
blockExoticSubdeps: true
# Requires every dependency with a lifecycle script to be listed in allowBuilds
strictDepBuilds: true

allowBuilds:
  unrs-resolver: true

overrides:
  chokidar: ^5.0.0
  semver: ^7.8.5
  ua-parser-js: 2.0.10
  moment: ^2.31.0
  dompurify: ^3.4.14
  js-cookie: ^3.0.7
  serialize-javascript: ^7.1.0
  # Grafana externalizes React Router v6 until https://github.com/grafana/grafana/issues/129933 lands.
  # v6.30.6 has no package fix for GHSA-wrjc-x8rr-h8h6; this browser plugin only uses static internal routes.
  # GHSA-337j-9hxr-rhxg affects SSR hydration, which this browser plugin does not use.
  'react-router@^6': ^6.30.6
  basic-ftp: '^6.2.1'
