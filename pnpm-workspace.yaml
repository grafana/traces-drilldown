packages:
  - '.'

# https://pnpm.io/supply-chain-security
# Same as passing --frozen-lockfile on every pnpm install (CI uses this via plugin-ci-workflows too).
frozenLockfile: true
# Disable lifecycle scripts like husky git hooks such as postinstall.
ignoreScripts: true
# Three days in minutes (3 × 24 × 60).
minimumReleaseAge: 4320
# Fail install if a package's trust evidence is weaker than an earlier release (e.g. lost trusted publisher).
trustPolicy: no-downgrade
# Transitive deps must come from the registry/workspace; block git/tarball URLs except on direct deps.
blockExoticSubdeps: true
# Requires every dependency with a lifecycle script to be listed in allowBuilds
strictDepBuilds: true

allowBuilds:
  unrs-resolver: true

overrides:
  chokidar: ^5.0.0
  semver: ^7.8.5
  ua-parser-js: 2.0.10
  lodash: ^4.18.0
  react-router: ^6.30.6
  serialize-javascript: ^7.1.0
  immutable: ^5.1.8
  dompurify: ^3.4.14
  yaml: ^2.8.3
  minimatch@^3: ~3.1.4
  minimatch@^9: ~10.2.0
  minimatch@^10: ^10.2.6
  uuid: ^14.0.2
  js-cookie: ^3.0.7
  ws: 8.21.3
  js-yaml: 4.3.2
  qs: ^6.15.3
  brace-expansion@^1: 1.1.18
  brace-expansion@^5: '>=5.0.9'
  fast-uri: '>=4.1.3'
  postcss: ^8.5.26
  nanoid@^3: '>=3.3.18 <4'
