apiVersion: 1

datasources:
  - name: gdev-testdata
    isDefault: false
    type: testdata

  - name: Tempo
    type: tempo
    access: proxy
    orgId: 1
    url: http://tempo:3200
    basicAuth: false
    isDefault: true
    version: 1
    editable: false
    apiVersion: 1
    uid: tempo

  # Deliberately left without a trace-to-logs configuration on the Tempo data source above, so the
  # devenv reproduces the state most users are in and exercises the detection path.
  - name: Loki
    type: loki
    access: proxy
    orgId: 1
    url: http://loki:3100
    basicAuth: false
    isDefault: false
    version: 1
    editable: true
    apiVersion: 1
    uid: loki

  - name: Tempo (Local Port Forward)
    type: tempo
    access: proxy
    orgId: 1
    url: http://host.docker.internal:3100/tempo
    basicAuth: false
    isDefault: false
    version: 1
    editable: false
    apiVersion: 1
    uid: tempo-local
    jsonData:
      httpHeaderName1: 'X-Scope-OrgID'
    secureJsonData:
      httpHeaderValue1: '6121'
