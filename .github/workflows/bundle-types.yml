name: Bundle Types

on:
  push:
    tags:
      - 'v*' # Run workflow on version tags, e.g. v1.0.0.

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# These permissions are needed to assume roles from Github's OIDC.
permissions:
  contents: read
  id-token: write

jobs:
  bundle-types:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (2026-01-09)
        with:
          persist-credentials: false

      - uses: grafana/plugin-actions/bundle-types@e62759a5ee1a708adb4a1f564f8ae085cd47aedf # bundle-types/v1.0.8
        with:
          entry-point: ./src/exposedComponents/types.ts
          ts-config: ./tsconfig-for-bundle-types.json
          node-version: '22'
